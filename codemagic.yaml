# Codemagic CI/CD for the Kilos Flutter app (lives in ./mobile-app).
#
# The repo root is a Vite/React web app; the mobile app is a Flutter project in
# `mobile-app/`, which is why every workflow sets `working_directory`. Codemagic
# reads this file from the repo root — leave it here.
#
# Two workflows:
#   ios-validate  — unsigned compile check. Needs NO Apple Developer account.
#                   Run this first to prove the iOS toolchain is green.
#   ios-release   — signed .ipa -> App Store Connect / TestFlight via Shorebird.
#                   Needs the $99/yr Apple Developer Program + setup in
#                   mobile-app/CODEMAGIC-IOS.md + SHOREBIRD_TOKEN env var.

definitions:
  cache: &flutter_cache
    cache_paths:
      - $HOME/.pub-cache

workflows:

  # ---------------------------------------------------------------------------
  # 1. Does it even build? No Apple account, no certificates, no signing.
  # ---------------------------------------------------------------------------
  ios-validate:
    name: iOS · unsigned build check
    instance_type: mac_mini_m2
    max_build_duration: 45
    working_directory: mobile-app
    cache: *flutter_cache
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Toolchain versions
        script: |
          flutter --version
          pod --version
      - name: Enable Swift Package Manager
        script: flutter config --enable-swift-package-manager || true
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze --no-pub || true
      - name: Build unsigned iOS app
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
      - flutter_drive.log
      - /tmp/xcodebuild_logs/*.log

  # ---------------------------------------------------------------------------
  # 2. Shorebird release → signed .ipa → TestFlight.
  #    Uses `shorebird release ios` instead of `flutter build ipa` so that
  #    future `shorebird patch ios` calls (from GitHub Actions on every push)
  #    can push OTA updates without a new App Store submission.
  # ---------------------------------------------------------------------------
  ios-release:
    name: iOS · TestFlight release (Shorebird)
    instance_type: mac_mini_m2
    max_build_duration: 90
    working_directory: mobile-app
    cache: *flutter_cache
    integrations:
      # Must match the App Store Connect API key name you added under
      # Codemagic -> Teams/Personal Account -> Integrations -> App Store Connect.
      app_store_connect: Kilos App Store Connect
    environment:
      flutter: stable
      # Pinned, not `latest`: a Shorebird patch is rejected when the Xcode that
      # builds it differs from the one that built the release, so this has to
      # stay in step with .github/workflows/mobile-ota.yml.
      xcode: 26.4.1
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.devloft.kilos
      vars:
        BUNDLE_ID: "com.devloft.kilos"
        APP_STORE_APP_ID: "6804961729"
        FIREBASE_IOS_APP_ID: "1:1042216377771:ios:95344c3054e0f8417e46ee"
        FIREBASE_IOS_API_KEY: "AIzaSyDN2kYkL8GzaTfKG6md7CJs_m3p--1UT9U"
      # SHOREBIRD_TOKEN lives in a Codemagic environment variable GROUP named
      # `shorebird`. Codemagic only injects team variables into a build if the
      # workflow names their group here — without this line the token never
      # reaches the machine and `shorebird release` fails to authenticate.
      # Codemagic UI: Teams → Environment variables → group `shorebird`,
      # name SHOREBIRD_TOKEN, value from `shorebird login:ci`, tick Secret.
      groups:
        - shorebird
    scripts:
      - name: Enable Swift Package Manager
        script: flutter config --enable-swift-package-manager || true
      - name: Get Flutter packages
        script: flutter pub get
      - name: Apply provisioning profiles to Xcode project
        script: xcode-project use-profiles
      - name: Install Shorebird CLI
        script: |
          curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
          # $CM_ENV is parsed as plain KEY=value lines — an `export` prefix makes
          # the line invalid and the PATH change is silently dropped.
          echo "PATH=$HOME/.shorebird/bin:$PATH" >> $CM_ENV
          "$HOME/.shorebird/bin/shorebird" --version
      - name: Build signed .ipa via Shorebird
        script: |
          set -e

          # Belt and braces: re-add it here so this step never depends on the
          # previous step's $CM_ENV write having taken effect.
          export PATH="$HOME/.shorebird/bin:$PATH"

          is_set() { [ -n "$1" ] && [ "$1" != "CHANGEME" ]; }

          # --- build number ------------------------------------------------
          if is_set "$APP_STORE_APP_ID"; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo 0)
            BUILD_NUM=$(( LATEST + 1 ))
          else
            BUILD_NUM=$PROJECT_BUILD_NUMBER
          fi
          echo "Building build number $BUILD_NUM"

          # --- Firebase iOS identity ---------------------------------------
          DEFINES=""
          if is_set "$FIREBASE_IOS_APP_ID"; then
            DEFINES="$DEFINES --dart-define=FIREBASE_IOS_APP_ID=$FIREBASE_IOS_APP_ID"
          fi
          if is_set "$FIREBASE_IOS_API_KEY"; then
            DEFINES="$DEFINES --dart-define=FIREBASE_IOS_API_KEY=$FIREBASE_IOS_API_KEY"
          fi

          # `shorebird release ios` builds the .ipa AND registers it with
          # Shorebird so patches can be pushed to it later via GitHub Actions.
          # Flutter args go after `--`.
          yes | shorebird release ios \
            -- \
            --build-number="$BUILD_NUM" \
            $DEFINES \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - devlofttech@gmail.com
        notify:
          success: true
          failure: true

# ---------------------------------------------------------------------------
# Auto-triggering is off on purpose so pushes don't silently burn build minutes.
# ---------------------------------------------------------------------------
