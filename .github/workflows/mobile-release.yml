name: Cut store release (baseline)

# Builds a signed Android release on Linux (no Windows spaced-path issues),
# registers it as a Shorebird baseline, and uploads the AAB as a downloadable
# artifact you then upload to Play Console. Run it from the Actions tab
# (workflow_dispatch) or by pushing a version tag like v1.0.0.

on:
  workflow_dispatch: {}
  push:
    tags: [ 'v*' ]

jobs:
  android-release:
    name: Android baseline → Shorebird + AAB artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs Flutter + the Shorebird CLI (its own bundled Flutter).
      - uses: shorebirdtech/setup-shorebird@v1

      - name: Restore signing keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/mobile-app/android/upload-keystore.jks"
          cat > "$GITHUB_WORKSPACE/mobile-app/android/key.properties" <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$GITHUB_WORKSPACE/mobile-app/android/upload-keystore.jks
          EOF

      - name: Shorebird release (Android)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        # `yes` auto-answers the confirmation prompt. CI env is non-interactive.
        run: yes | shorebird release android

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: kilos-release-aab
          path: mobile-app/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
