name: Ship to phones (Shorebird OTA)

# Every push to main that touches the mobile app ships the Dart change over-the-air
# to already-installed Android devices via Shorebird — no app-store round trip.
# Users get it on next app launch. (iOS OTA is added later once its baseline exists;
# it needs a macOS runner + Apple signing — see CICD-SETUP.md.)

on:
  push:
    branches: [ main ]
    paths: [ 'mobile-app/**' ]
  workflow_dispatch: {}   # allow manual runs from the Actions tab

concurrency:
  group: mobile-ota-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-patch:
    name: OTA patch → Android phones
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs Flutter + the Shorebird CLI (its own bundled Flutter).
      - uses: shorebirdtech/setup-shorebird@v1

      - name: Push OTA patch to Android
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        # `yes` auto-answers Shorebird's confirmation prompt. Patches the latest
        # Android release (the baseline). No keystore needed — a patch is a code
        # diff matched by app_id + release version, not a distributable signed build.
        run: yes | shorebird patch android
