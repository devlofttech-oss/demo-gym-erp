name: Ship to phones (Shorebird OTA)

# Every push to main that touches the mobile app ships the Dart change over-the-air
# to already-installed Android AND iOS devices via Shorebird — no app-store round trip.
# Users get it on next app launch.

on:
  push:
    branches: [ main ]
    paths: [ 'mobile-app/**' ]
  workflow_dispatch: {}   # allow manual runs from the Actions tab

concurrency:
  group: mobile-ota-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-patch:
    name: OTA patch → Android phones
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs Flutter + the Shorebird CLI (its own bundled Flutter).
      - uses: shorebirdtech/setup-shorebird@v1

      - name: Push OTA patch to Android
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        # `yes` auto-answers Shorebird's confirmation prompt. Patches the latest
        # Android release (the baseline). No keystore needed — a patch is a code
        # diff matched by app_id + release version, not a distributable signed build.
        run: yes | shorebird patch android --release-version=latest

  ios-patch:
    name: OTA patch → iOS phones
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      # `shorebird patch ios` runs `flutter build ipa --release` under the hood
      # to compile the Dart and diff it against the release, so this runner
      # needs a real signing identity — exactly like any archive build.
      # Without it the build dies with "No valid code signing certificates".
      - name: Import Apple distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12 }}
          p12-password: ${{ secrets.IOS_CERT_PASSWORD }}

      - name: Install provisioning profile
        working-directory: .
        run: |
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          echo "${{ secrets.IOS_PROVISION_PROFILE }}" | base64 --decode > "$PROFILES/kilos_appstore.mobileprovision"

      # Shorebird refuses to patch when Assets.car differs, and the Xcode
      # version alone changes that file's binary encoding. The release was cut
      # on Codemagic with Xcode 26.4.1; this runner defaults to 26.6, which is
      # what produced UnpatchableChangeException. Keep the two in step --
      # codemagic.yaml pins the same version.
      - name: Match the Xcode version used for the release
        working-directory: .
        run: |
          echo "Available:"; ls -d /Applications/Xcode*.app
          if [ -d "/Applications/Xcode_26.4.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.1.app
          else
            echo "WARNING: Xcode 26.4.1 is not on this runner image."
          fi
          xcodebuild -version

      # The release was built on Codemagic with CocoaPods 1.16.2; this runner
      # ships 1.17.0, and the version is recorded in Podfile.lock, so the locks
      # differ and Shorebird rejects the patch as a native change. Force the
      # same version -- codemagic.yaml pins it too.
      - name: Match the CocoaPods version used for the release
        working-directory: .
        run: |
          sudo gem uninstall cocoapods --all --executables --force >/dev/null 2>&1 || true
          sudo gem install cocoapods -v 1.16.2 --no-document
          pod --version

      - uses: shorebirdtech/setup-shorebird@v1

      # Switches Runner.xcodeproj to manual signing and points it at the profile
      # installed above. This is the same tool Codemagic runs for the release
      # build; the certificate alone is not enough.
      - name: Apply provisioning profile to Xcode project
        run: |
          pip3 install --quiet codemagic-cli-tools             || pip3 install --quiet --break-system-packages codemagic-cli-tools
          xcode-project use-profiles

      - name: Push OTA patch to iOS
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: yes | shorebird patch ios --release-version=latest

      # ios/Podfile.lock is not in the repo, so every machine resolves pods on
      # its own and Shorebird reads the difference as a native change. Surface
      # the lock this run generated so it can be committed and pinned.
      - name: Upload the generated Podfile.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-podfile-lock
          path: mobile-app/ios/Podfile.lock
          if-no-files-found: warn
